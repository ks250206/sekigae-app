<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fc" />
    <meta name="description" content="研究室の席配置をブラウザだけで決めるアプリ" />
    <title>Sekigae</title>
    <script>
      // 初期描画前にテーマを適用してちらつきを防ぐ (FOUC 防止)
      (function () {
        try {
          var raw = localStorage.getItem("sekigae:v1:prefs");
          var theme = raw ? (JSON.parse(raw).state || {}).theme : "system";
          var lang = raw ? (JSON.parse(raw).state || {}).language : null;
          var dark =
            theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (lang) document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
